# compose.yml に重ねて使う練習用の設定。scripts/practice.sh から読み込む。
services:
  app:
    build:
      context: golang/
    deploy:
      resources:
        limits:
          cpus: "2"

  # nginxからappへは毎回新しい接続を作るので、既定のままでは送信ポートが
  # 枯渇して502になる。計測環境の前提として広げる。
  nginx:
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"

  # 1CPUの制限では、ベンチ中にMySQLが上限に張り付いた。
  # 競技用の推奨であるc7a.large（2 vCPU）に合わせる。
  mysql:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
