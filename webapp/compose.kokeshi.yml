# compose.yml に重ねて使う練習用の設定。scripts/practice.sh から読み込む。
services:
  app:
    build:
      context: golang/
    volumes:
      - images:/home/public/image
    deploy:
      resources:
        limits:
          cpus: "2"

  # DBから遠い場所に置くアプリ
  app2:
    build:
      context: golang/
    depends_on:
      - mysql
      - memcached
    environment:
      ISUCONP_DB_HOST: mysql
      ISUCONP_DB_PORT: 3306
      ISUCONP_DB_USER: root
      ISUCONP_DB_PASSWORD: root
      ISUCONP_DB_NAME: isuconp
      ISUCONP_MEMCACHED_ADDRESS: memcached:11211
    networks:
      - my_network
    volumes:
      - ./public:/home/public
      - images:/home/public/image
    init: true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # nginxからappへは毎回新しい接続を作るので、既定のままでは送信ポートが
  # 枯渇して502になる。計測環境の前提として広げる。
  nginx:
    volumes:
      - images:/public/image:ro
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"

  # 1CPUの制限では、ベンチ中にMySQLが上限に張り付いた。
  # 競技用の推奨であるc7a.large（2 vCPU）に合わせる。
  mysql:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  images:
