server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  location ~ ^/(css|js|img)/ {
    expires 1d;
  }

  location = /favicon.ico {
    expires 1d;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://app:8080;
  }

  location @app {
    proxy_set_header Host $host;
    proxy_pass http://app:8080;
  }
}
