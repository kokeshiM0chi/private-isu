# 書き込みはDBに近いapp、読み取りはキャッシュに近いapp2へ振り分ける
upstream near_app {
  server app:8080;
  keepalive 64;
}

upstream far_app {
  server app2:8080;
  keepalive 64;
}

map $request_method $app_upstream {
  default far_app;
  POST near_app;
}

server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;

  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  location ~ ^/(css|js|img)/ {
    expires 1d;
  }

  location = /favicon.ico {
    expires 1d;
  }

  # 初期化はDBに近いappで実行する
  location = /initialize {
    proxy_pass http://near_app;
  }

  location / {
    proxy_pass http://$app_upstream;
  }

  location @app {
    proxy_pass http://$app_upstream;
  }
}
